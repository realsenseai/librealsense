name: Python bindings CI

# Focused coverage for the build-system changes that let pyrealsense2 compile
# against current CPython releases (3.13-3.15) on x86_64 and ARM64. The main
# buildsCI workflow continues to cover the older interpreters and full SDK.

on:
  push:
    branches: [development]
    paths:
      - 'wrappers/python/**'
      - 'third-party/rsutils/py/**'
      - 'CMake/external_pybind11.cmake'
      - 'CMake/pybind11-download.cmake.in'
      - '.github/workflows/python-bindings-CI.yaml'
  pull_request:
    branches: [development]
    paths:
      - 'wrappers/python/**'
      - 'third-party/rsutils/py/**'
      - 'CMake/external_pybind11.cmake'
      - 'CMake/pybind11-download.cmake.in'
      - '.github/workflows/python-bindings-CI.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 is stable, but a runner whose manifest still lists only the
          # pre-release can fall back to it instead of failing.
          allow-prereleases: true

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -qq \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libusb-1.0-0-dev

      - name: Configure
        shell: bash
        run: |
          python -c "import sys; print('Building for', sys.version)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_GRAPHICAL_EXAMPLES=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_WITH_DDS=OFF \
            -DBUILD_PC_STITCHING=OFF \
            -DBUILD_UNIT_TESTS=OFF \
            -DCHECK_FOR_UPDATES=OFF \
            -DENABLE_AI_ASSISTANT=OFF \
            -DENABLE_STATS=OFF \
            -DFORCE_RSUSB_BACKEND=ON

      - name: Build pyrealsense2
        shell: bash
        run: cmake --build build --target pyrealsense2 --parallel "$(nproc)"

      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python wrappers/python/build_wheel.py --build-dir build
          python -m pip install --force-reinstall wrappers/python/dist/pyrealsense2-*.whl
          # The wheel must not depend on the build tree's rpath
          mv build build.hidden
          python -c "import pyrealsense2 as rs; print('pyrealsense2', rs.__version__)"
