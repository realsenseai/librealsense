name: Build_CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions: read-all
     
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)  
  LRS_BUILD_CONFIG: Debug
  LRS_RUN_CONFIG: Release
  LRS_RUN_WITH_DEB_CONFIG: RelWithDebInfo
  # GH-Actions Windows VM currently supply ~14 GB available on D drive, and ~80 GB on drive C.
  # Building LRS statically with third parties is too much for drive D so we clone to drive 'D' and build on drive 'C'
  WIN_BUILD_DIR: C:/lrs_build


jobs:


  #--------------------------------------------------------------------------------
  Source_Checks:  # Header self-containment and copyright/license/whitespace lint (no build)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Check API headers
      run: cd scripts && ./api_check.sh

    - name: PR check
      run: cd scripts && ./pr_check.sh


  #--------------------------------------------------------------------------------
  Infra_Tests:  # Pytest infrastructure regression tests (no build, no devices)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Install
      run: pip3 install -r unit-tests/requirements.txt

    - name: Run infra tests
      run: cd unit-tests && python3 -m pytest infra-tests/ -v


  #--------------------------------------------------------------------------------
  Win_SH_EX:  # Windows, shared, with Examples & Tools
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - name: Win_SH_EX_CfU  # Check for Updates, no usage monitoring
            cmake-options: -DCHECK_FOR_UPDATES=true -DENABLE_STATS=OFF
          - name: Win_SH_EX_No_Logs  # no EasyLogging and no Check for Updates
            cmake-options: -DCHECK_FOR_UPDATES=false -DBUILD_EASYLOGGINGPP=false
    name: ${{ matrix.name }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - uses: ./.github/actions/windows-build
      with:
        cmake-options: >-
          -DBUILD_SHARED_LIBS=true
          -DBUILD_EXAMPLES=true
          -DBUILD_TOOLS=true
          ${{ matrix.cmake-options }}

  #--------------------------------------------------------------------------------
  Win_ST_Py_CI:  # Windows, Static, Python, Tools, libCI with executables
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
      with:
       python-version: '3.9'

    - name: Install numpy
      shell: bash
      run: python3 -m pip install numpy

    - uses: ./.github/actions/windows-build
      with:
        cmake-options: >-
          -DBUILD_SHARED_LIBS=false
          -DBUILD_EXAMPLES=false
          -DBUILD_TOOLS=true
          -DBUILD_UNIT_TESTS=true
          -DUNIT_TESTS_ARGS="--not-live --context=windows"
          -DCHECK_FOR_UPDATES=false
          -DBUILD_WITH_DDS=false
          -DBUILD_PYTHON_BINDINGS=true

    - name: LibCI
      # Note: requires BUILD_UNIT_TESTS or the executable C++ unit-tests won't run (and it won't complain)
      shell: bash
      run: |
        python3 unit-tests/run-unit-tests.py --no-color --debug --stdout --not-live --context "windows" ${{env.WIN_BUILD_DIR}}/Release

    - name: LibCI (pytest)
      shell: bash
      run: |
        python3 -m pip install -r unit-tests/requirements.txt
        python3 -m pytest unit-tests/ --color=no --debug -s --not-live --context "windows"

    - name: Client for realsense2-all
      shell: bash
      run: |
        mkdir ${{env.WIN_BUILD_DIR}}/rs-all-client
        cd ${{env.WIN_BUILD_DIR}}/rs-all-client
        cmake $GITHUB_WORKSPACE/.github/workflows/rs-all-client -A x64
        cmake --build . --config Release -- -m
        ./Release/rs-all-client

  #--------------------------------------------------------------------------------
  Win_SH_Py_DDS_SEC_CI:  # Windows, Shared, Python, Tools, DDS, security flags, libCI without executables
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
      with:
       python-version: '3.9'

    - name: Install numpy
      shell: bash
      run: python3 -m pip install numpy

    - uses: ./.github/actions/windows-build
      with:
        cmake-options: >-
          -DBUILD_SHARED_LIBS=true
          -DBUILD_EXAMPLES=false
          -DBUILD_TOOLS=true
          -DBUILD_UNIT_TESTS=true
          -DCHECK_FOR_UPDATES=false
          -DBUILD_WITH_DDS=true
          -DBUILD_PYTHON_BINDINGS=true
          -DENABLE_SECURITY_FLAGS=true

    - name: LibCI
      shell: bash
      run: |
        python3 unit-tests/run-unit-tests.py --no-color --debug --stdout --not-live --context "dds windows" ${{env.WIN_BUILD_DIR}}/Release

    - name: LibCI (pytest)
      shell: bash
      run: |
        python3 -m pip install -r unit-tests/requirements.txt
        python3 -m pytest unit-tests/ --color=no --debug -s --not-live --context "dds windows" --tag dds

  #--------------------------------------------------------------------------------
  Win_SH_Py_RSUSB_Csharp:  # Windows, Shared, Python, RSUSB backend, C# bindings, Debug build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
      with:
       python-version: '3.9'

    - uses: ./.github/actions/windows-build
      with:
        config: ${{ env.LRS_BUILD_CONFIG }}
        cmake-options: >-
          -DBUILD_SHARED_LIBS=true
          -DBUILD_EXAMPLES=false
          -DBUILD_TOOLS=false
          -DCHECK_FOR_UPDATES=false
          -DBUILD_PYTHON_BINDINGS=true
          -DFORCE_RSUSB_BACKEND=true
          -DBUILD_CSHARP_BINDINGS=true
          -DDOTNET_VERSION_LIBRARY="4.8"
          -DDOTNET_VERSION_EXAMPLES="4.8"

  #--------------------------------------------------------------------------------
  Win_ARM64_SH:  # Windows ARM64, shared, library only
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - uses: ./.github/actions/windows-build
      with:
        arch: ARM64
        target: realsense2
        cmake-options: >-
          -DBUILD_SHARED_LIBS=true
          -DBUILD_EXAMPLES=false
          -DBUILD_TOOLS=false
          -DCHECK_FOR_UPDATES=false
          -DENABLE_STATS=OFF

  #--------------------------------------------------------------------------------
  U22_U24_ST_Py_EX_CfU:  # Ubuntu, Static, Python, Examples & Tools, Check for Updates
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
        include:
          - os: ubuntu-22.04
            name: U22
          - os: ubuntu-24.04
            name: U24
          - os: ubuntu-latest  # follows GitHub's default image, so new images are caught before older ones are deprecated
            name: U-Latest
    name: ${{ matrix.name }}_ST_Py_EX_CfU
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Install CMake 4
      if: matrix.os == 'ubuntu-24.04'
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
      with:
        cmake-version: '4.x'

    - uses: ./.github/actions/install-linux-deps

    - uses: ./.github/actions/linux-build
      # Adding -DENABLE_SECURITY_FLAGS=true here to also check examples and tools. See RSDSO-RSDSO-20629.
      with:
        cmake-options: >-
          -DBUILD_EXAMPLES=true
          -DBUILD_PYTHON_BINDINGS=true
          -DBUILD_SHARED_LIBS=false
          -DBUILD_TOOLS=true
          -DCHECK_FOR_UPDATES=true
          -DENABLE_SECURITY_FLAGS=true

  #--------------------------------------------------------------------------------
  U22_U26_SH_Py_CI:  # Ubuntu, Shared, Python, LibCI with executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: U22_SH_Py_CI  # no usage monitoring
            cmake-options: -DENABLE_STATS=OFF
          - os: ubuntu-26.04
            name: U26_SH_Py_CI_SYS_JSON  # system provided nlohmann_json library
            apt-packages: nlohmann-json3-dev
            cmake-options: -DUSE_EXTERNAL_NLOHMANN_JSON=ON
    name: ${{ matrix.name }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - uses: ./.github/actions/install-linux-deps
      with:
        apt-packages: ${{ matrix.apt-packages }}
        pip-packages: numpy

    - name: Show system nlohmann_json version
      if: matrix.os == 'ubuntu-26.04'
      shell: bash
      run: dpkg -s nlohmann-json3-dev | grep "Package\|Version" | xargs

    - uses: ./.github/actions/linux-build
      with:
        cmake-options: >-
          -DBUILD_SHARED_LIBS=true
          -DBUILD_EXAMPLES=false
          -DBUILD_TOOLS=true
          -DBUILD_UNIT_TESTS=true
          -DBUILD_PYTHON_BINDINGS=true
          -DBUILD_WITH_DDS=false
          -DCHECK_FOR_UPDATES=false
          -DUNIT_TESTS_ARGS="--not-live --context=linux"
          ${{ matrix.cmake-options }}

    - name: LibCI
      # Note: requires BUILD_UNIT_TESTS or the executable C++ unit-tests won't run (and it won't complain)
      shell: bash
      run: |
        python3 unit-tests/run-unit-tests.py --no-color --debug --stdout --not-live --context "linux"

    - name: LibCI (pytest)
      shell: bash
      run: |
        python3 -m pip install -r unit-tests/requirements.txt
        python3 -m pytest unit-tests/ --color=no --debug -s --not-live --context "linux"

  #--------------------------------------------------------------------------------
  U22_ST_Py_DDS_RSUSB_SEC:  # Ubuntu 2020, Static, Python, DDS, RSUSB, additional security checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - uses: ./.github/actions/install-linux-deps
      with:
        pip-packages: numpy

    - uses: ./.github/actions/linux-build
      # Note: we force RSUSB because, on Linux, the context creation will fail on GHA:
      #     (backend-v4l2.cpp:555) Cannot access /sys/class/video4linux)
      # And, well, we don't need any specific platform for DDS!
      with:
        cmake-options: >-
          -DBUILD_EXAMPLES=false
          -DBUILD_PYTHON_BINDINGS=true
          -DBUILD_SHARED_LIBS=false
          -DBUILD_TOOLS=false
          -DBUILD_UNIT_TESTS=false
          -DBUILD_WITH_DDS=true
          -DCHECK_FOR_UPDATES=false
          -DENABLE_SECURITY_FLAGS=true
          -DFORCE_RSUSB_BACKEND=true

    - name: Client for realsense2-all
      shell: bash
      run: |
        mkdir build/rs-all-client
        cd build/rs-all-client
        cmake ../../.github/workflows/rs-all-client -DBUILD_WITH_DDS=ON -DFORCE_RSUSB_BACKEND=ON
        cmake --build . -- -j4
        ./rs-all-client
  

  #--------------------------------------------------------------------------------
  U22_U24_SH_Py_DDS_SEC_CI:  # Ubuntu, Shared, Python, DDS, security flags, LibCI without executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        include:
          - os: ubuntu-22.04
            name: U22
          - os: ubuntu-24.04
            name: U24
    name: ${{ matrix.name }}_SH_Py_DDS_SEC_CI
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Install CMake 4
      if: matrix.os == 'ubuntu-24.04'
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
      with:
        cmake-version: '4.x'

    - uses: ./.github/actions/install-linux-deps
      with:
        apt-packages: python3-numpy

    - uses: ./.github/actions/linux-build
      # Adding -DENABLE_SECURITY_FLAGS=true here to also check DDS. See RSDSO-RSDSO-20629.
      with:
        cmake-options: >-
          -DBUILD_EXAMPLES=false
          -DBUILD_PYTHON_BINDINGS=true
          -DBUILD_SHARED_LIBS=true
          -DBUILD_TOOLS=false
          -DBUILD_UNIT_TESTS=true
          -DBUILD_WITH_DDS=true
          -DCHECK_FOR_UPDATES=false
          -DENABLE_SECURITY_FLAGS=true

    - name: LibCI
      shell: bash
      run: |
        python3 unit-tests/run-unit-tests.py --no-color --debug --stdout --not-live --context "dds linux" --tag dds

    - name: LibCI (pytest)
      shell: bash
      run: |
        python3 -m pip install -r unit-tests/requirements.txt
        python3 -m pytest unit-tests/ --color=no --debug -s --not-live --context "dds linux" --tag dds

  #--------------------------------------------------------------------------------
  
  Mac_DDS_cpp:
    runs-on: macos-15
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Prebuild
      run: |
        mkdir build
        # install coreutils for greadlink use
        brew install coreutils
        brew install homebrew/core/glfw;
        brew list libusb || brew install libusb;
        
    - name: Build
      run: |
        cd build
        # `OPENSSL_ROOT_DIR` setting is Used by libcurl for 'CHECK_FOR_UPDATES' capability
        export OPENSSL_ROOT_DIR=$(brew --prefix openssl)
        echo "OPENSSL_ROOT_DIR = ${OPENSSL_ROOT_DIR}"
        cmake .. -DCMAKE_CXX_STANDARD=20 -DCMAKE_BUILD_TYPE=${{env.LRS_BUILD_CONFIG}} -DBUILD_EXAMPLES=true -DBUILD_WITH_OPENMP=false -DHWM_OVER_XU=false -DCHECK_FOR_UPDATES=true -DBUILD_WITH_DDS=true
        cmake --build . -- -j4
        ls


  #--------------------------------------------------------------------------------
  Android_cpp:
    runs-on: ubuntu-22.04   
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Prebuild 
      shell: bash
      run: |
        mkdir build
        wget https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip;
        unzip -q android-ndk-r20b-linux-x86_64.zip -d ./;
        sudo apt-get update;
        sudo apt-get install -qq build-essential xorg-dev libgl1-mesa-dev libglu1-mesa-dev libglew-dev libglm-dev;
        sudo apt-get install -qq libusb-1.0-0-dev;
        sudo apt-get install -qq libgtk-3-dev;
        sudo apt-get install libglfw3-dev libglfw3;        
    - name: Build
      run: |
       cd build
       cmake .. -DCMAKE_BUILD_TYPE=${{env.LRS_BUILD_CONFIG}} -DCMAKE_TOOLCHAIN_FILE=../android-ndk-r20b/build/cmake/android.toolchain.cmake -DFORCE_RSUSB_BACKEND=true
       cmake --build . -- -j4
       ls


  #--------------------------------------------------------------------------------
  U22_SH_No_Rosbag2:  # Ubuntu 22.04, Shared, without rosbag2 (ROS2) support
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - uses: ./.github/actions/install-linux-deps

    - uses: ./.github/actions/linux-build
      with:
        cmake-options: >-
          -DBUILD_EXAMPLES=false
          -DBUILD_ROSBAG2=OFF
          -DBUILD_SHARED_LIBS=true
          -DBUILD_TOOLS=true
          -DBUILD_UNIT_TESTS=false
          -DBUILD_WITH_DDS=false
          -DCHECK_FOR_UPDATES=false

