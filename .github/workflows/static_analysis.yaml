name: static_analysis

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    
permissions: read-all

jobs:
  ClangTidy:
    name: clang-tidy
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    # PRs check only the lines they change and fail on any finding; development pushes and manual runs scan everything as a report
    if: github.event_name != 'push' || github.ref == 'refs/heads/development'
    strategy:
      # Full scans are split across parallel jobs to keep wall time down
      matrix:
        shard: ${{ fromJSON( github.event_name == 'pull_request' && '[0]' || '[0,1,2,3]' ) }}
    env:
      SCOPE: src common tools examples third-party/realdds third-party/rsutils
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -qq clang-19 clang-tidy-19 libcurl4-openssl-dev libudev-dev libusb-1.0-0-dev libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev

      - name: Configure
        run: |
          CC=clang-19 CXX=clang++-19 cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_WITH_DDS=ON -DCHECK_FOR_UPDATES=ON -DENABLE_STATS=ON

      - name: Analyze changed lines
        if: github.event_name == 'pull_request'
        run: |
          git diff -U0 origin/${{ github.base_ref }}...HEAD -- $SCOPE \
            | clang-tidy-diff-19.py -p1 -path build -j4 -quiet -iregex '.*\.(cpp|cc|h|hpp)' 2>&1 | tee clang-tidy.log || true
          grep -q Traceback clang-tidy.log && exit 1
          # Annotate the PR diff with each finding, and fail if there are any
          sed -nE "s#^$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)#::error file=\1,line=\2,col=\3::\5#p" clang-tidy.log | sort -u
          grep -qE ': (warning|error):' clang-tidy.log || exit 0
          echo "For a false positive, add // NOLINT(<check-name>) on the flagged line, with the check name shown in [brackets]"
          exit 1

      - name: Analyze full tree
        if: github.event_name != 'pull_request'
        run: |
          files=$(jq -r '.[].file' build/compile_commands.json | grep -E "^$GITHUB_WORKSPACE/(${SCOPE// /|})/.*\.(cpp|cc)$" | sort -u | awk 'NR % 4 == ${{ matrix.shard }}')
          run-clang-tidy-19 -p build -j4 -quiet $files > clang-tidy.log 2>&1 || true
          grep -E ': (warning|error):' clang-tidy.log | sort -u > clang-tidy.findings.log || true
          echo "### clang-tidy: $(wc -l < clang-tidy.findings.log) findings" >> $GITHUB_STEP_SUMMARY
          grep -oE '\[[a-z][^]]*\]$' clang-tidy.findings.log | sort | uniq -c | sort -rn | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: clang-tidy-log-${{ matrix.shard }}
          path: clang-tidy*.log
#---------------------------------------------------------------------------------------------------#
  ValgrindCheck:
    name: Valgrind Memory Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      
      - name: Install Valgrind
        run: |
          sudo apt-get update;
          sudo apt-get install -qq build-essential xorg-dev libgl1-mesa-dev libglu1-mesa-dev libglew-dev libglm-dev;
          sudo apt-get install -qq libusb-1.0-0-dev;
          sudo apt-get install -qq libgtk-3-dev;
          sudo apt-get install libglfw3-dev libglfw3;
          sudo apt-get install -y valgrind

      - name: Move files into examples folder in order to build automaticly
        run: |
            sudo mv .github/workflows/memory-leaks-check examples/

      - name: Modify CMakeLists.txt
        run: |
          # Path to the CMakeLists.txt file
          CMAKE_FILE=./examples/CMakeLists.txt

          # Check if the line already exists to avoid duplicates
          if ! grep -q "add_subdirectory(memory-leaks-check)" "$CMAKE_FILE"; then
            # Add the line before the first occurrence of 'add_subdirectory(hello-realsense)'
            sed -i '/add_subdirectory(hello-realsense)/i add_subdirectory(memory-leaks-check)' "$CMAKE_FILE"
          fi
      
      - name: Build Application
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_EXAMPLES=true
          make -j$(($(nproc)-1))
      
      - name: Run Valgrind
        run: |
          cd build
          valgrind --leak-check=yes --show-leak-kinds=all --track-origins=yes --log-file=valgrind-out.txt ./Release/mem-leak-test
        continue-on-error: true
      
      - name: Upload Valgrind log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: valgrind-log
          path: build/valgrind-out.txt

      - name: Check Valgrind Results
        run: |
            if grep -q "ERROR SUMMARY: [^0]" build/valgrind-out.txt; then
                echo "Valgrind detected errors with backend."
                exit 1
            else
                echo "No errors detected by Valgrind with backend."
            fi
  ASANCheck: 
    name: ASAN Memory Leak Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    
    - name: Install Dependencies
      run: |
        sudo apt-get update;
        sudo apt-get install -qq build-essential xorg-dev libgl1-mesa-dev libglu1-mesa-dev libglew-dev libglm-dev;
        sudo apt-get install -qq libusb-1.0-0-dev;
        sudo apt-get install -qq libgtk-3-dev;
        sudo apt-get install libglfw3-dev libglfw3;

    - name: Move files into examples folder in order to build automaticly
      run: |
            sudo mv .github/workflows/memory-leaks-check examples/

    - name: Modify CMakeLists.txt
      run: |
        # Path to the CMakeLists.txt file
        CMAKE_FILE=./examples/CMakeLists.txt

        # Check if the line already exists to avoid duplicates
        if ! grep -q "add_subdirectory(memory-leaks-check)" "$CMAKE_FILE"; then
        # Add the line before the first occurrence of 'add_subdirectory(hello-realsense)'
        sed -i '/add_subdirectory(hello-realsense)/i add_subdirectory(memory-leaks-check)' "$CMAKE_FILE"
        fi

    - name: Build Application with ASAN
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_EXAMPLES=true -DBUILD_ASAN=true
        make -j$(($(nproc)-1))

    - name: Run ASAN
      run: |
        cd build
        ASAN_OPTIONS=halt_on_error=0:detect_leaks=1:log_path=asan-out.txt ./Release/mem-leak-test
      continue-on-error: true

    - name: Upload ASAN log
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
          name: asan-log
          path: build/asan-out.txt*

    - name: Check ASAN Results
      run: |
            # Use a wildcard to match the file with any number appended
            ASAN_FILE=$(ls build/asan-out.txt* 2>/dev/null || true)
            if [ -n "$ASAN_FILE" ]; then
                if grep -q "SUMMARY: AddressSanitizer:" "$ASAN_FILE"; then
                    echo "ASAN detected memory leaks."
                    exit 1
                else
                    echo "No memory leaks detected by ASAN."
                fi
            else
                echo "No ASAN output file found. No errors detected."
            fi
  # We verify the minimal CMake version we support is preserved when building with default CMake flags.
  # Fast path: download only the declared minimal CMake version and try to configure with it.
  #            If that works, we are done (a minimal version lower than declared is fine too).
  # Slow path: only if the fast path fails, run nlohmann/cmake_min_version over all CMake releases
  #            to report which version actually is the minimal working one, so the fix is clear.
  minimal_cmake_version:
    name: "Minimal CMake version"
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      EXPECTED_CMAKE_MAJOR_VER: 3
      EXPECTED_CMAKE_MINOR_VER: 10
      # First release of the minimal version line (the real floor), used for the fast path only
      EXPECTED_CMAKE_PATCH_VER: 0
      # SHA-256 of cmake-<ver>-Linux-x86_64.tar.gz, from https://cmake.org/files/v<major>.<minor>/cmake-<ver>-SHA-256.txt
      EXPECTED_CMAKE_SHA256: 6b5ea290042fac96023fd5387cd65cc69fdf4f48bad91177eb8697ba37e3deb3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: "Install Dependencies"
        run: |
          echo "Install LibRealSense pre-installed packages requirements"
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev at

      - name: "Download minimal CMake"
        run: |
          ver="${EXPECTED_CMAKE_MAJOR_VER}.${EXPECTED_CMAKE_MINOR_VER}.${EXPECTED_CMAKE_PATCH_VER}"
          url="https://cmake.org/files/v${EXPECTED_CMAKE_MAJOR_VER}.${EXPECTED_CMAKE_MINOR_VER}/cmake-${ver}-Linux-x86_64.tar.gz"
          echo "Downloading $url"
          mkdir -p "$RUNNER_TEMP/cmake-min"
          curl -fsSL "$url" -o "$RUNNER_TEMP/cmake-min.tar.gz"
          echo "${EXPECTED_CMAKE_SHA256}  $RUNNER_TEMP/cmake-min.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cmake-min.tar.gz" -C "$RUNNER_TEMP/cmake-min" --strip-components=1
          "$RUNNER_TEMP/cmake-min/bin/cmake" --version

      - name: "Configure with minimal CMake"
        id: fast_path
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/build-min-cmake"
          cd "$RUNNER_TEMP/build-min-cmake"
          "$RUNNER_TEMP/cmake-min/bin/cmake" "$GITHUB_WORKSPACE"

      - name: "Find actual minimal CMake version"
        if: steps.fast_path.outcome == 'failure'
        id: slow_path
        # Diagnostic only - a failure here (e.g. network) must not hide the final check's message
        continue-on-error: true
        run: |
          work_dir=$(pwd)
          cd "$RUNNER_TEMP"

          git clone https://github.com/nlohmann/cmake_min_version.git
          cd cmake_min_version
          # We clone a specific commit which we tested the process as working
          git checkout 687dc56e1cf52c865cebf6ac94ad67906d6e1369

          python3 -mvenv venv
          venv/bin/pip3 install -r requirements.txt

          # Download the first patch of every CMake minor release and binary-search for the minimal working one
          venv/bin/python3 cmake_downloader.py --first_minor
          output=$(venv/bin/python3 cmake_min_version.py $work_dir)

          # Sample of Expected Output of cmake_min_version.py ***
          # [  0%] CMake 3.9.2    ✔ works
          # [ 12%] CMake 3.2.2    ✘ error
          #        CMakeLists.txt:7 (cmake_minimum_required)
          # [ 33%] CMake 3.8.0    ✔ works
          # [ 50%] CMake 3.7.1    ✘ error
          #        CMakeLists.txt:16 (target_compile_features)
          # [ 80%] CMake 3.7.2    ✘ error
          #        CMakeLists.txt:16 (target_compile_features)
          # [100%] Minimal working version: CMake 3.8.0
          #
          # cmake_minimum_required(VERSION 3.8.0)

          echo "$output"

          # Retrieve CMake minimal version from the last line of the tool output.
          actual=$(echo ${output} | grep -oP "VERSION \d+\.\d+" | grep -oP "\d+\.\d+" || echo "NOT FOUND")
          echo "actual_cmake_version=$actual" >> $GITHUB_OUTPUT

      - name: "Check minimal CMake version"
        env:
          FAST_PATH_OUTCOME: ${{ steps.fast_path.outcome }}
          ACTUAL_CMAKE_VERSION: ${{ steps.slow_path.outputs.actual_cmake_version }}
        run: |
          EXPECTED="${EXPECTED_CMAKE_MAJOR_VER}.${EXPECTED_CMAKE_MINOR_VER}"
          [ -z "$ACTUAL_CMAKE_VERSION" ] && ACTUAL_CMAKE_VERSION="(could not determine, see the 'Find actual minimal CMake version' step)"
          if [ "$FAST_PATH_OUTCOME" == "success" ]
          then
            echo "The test PASSED, LibRS configures with the minimal CMake version ${EXPECTED}"
          else
            echo "Error - The minimal CMake version required for LibRS is ${EXPECTED} but on this build the minimal CMake version that works is ${ACTUAL_CMAKE_VERSION}"
            echo "See the 'Configure with minimal CMake' step above for the CMake error with version ${EXPECTED}"
            exit 1
          fi

  build_flags_docs:
    name: "Generate build-flags.html"
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Build docs 
        run: |
            python3 scripts/lrs_options-to-html.py
